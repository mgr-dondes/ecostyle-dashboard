name: Daily Report

on:
  schedule:
    - cron: "10 5 * * 1-5"
    - cron: "10 11 * * 1-5"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node send-report.js
